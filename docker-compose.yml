services:
  boteco-api:
    build: .
    container_name: boteco-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-boteco}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super-secret-refresh-key-boteco}
      - BARS_CACHE_TTL_SECONDS=60
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - boteco-net
    restart: unless-stopped

  # Segundo banco de dados: Redis para Cache, Idempotência, Rate Limiting e Revogação de Tokens
  # O primeiro banco é o Firebase Firestore na nuvem
  redis:
    image: redis:7-alpine
    container_name: boteco-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - boteco-net
    restart: unless-stopped

networks:
  boteco-net:
    driver: bridge

volumes:
  redis_data:
